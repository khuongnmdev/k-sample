<h3>Demo Polling List Item with Signal + Switch Map</h3>
<button class="btn" (click)="addItem()">
  Add Item
</button>
<hr>

<button class="btn" (click)="removeItem()" [disabled]="!this.listItem()">
  Remove Item
</button>
<hr>
<p>
  List Item: {{ listItem() | json }}
</p>
<hr>
@for (rs of result(); track rs) {
  <p>{{ rs }}</p>
}
