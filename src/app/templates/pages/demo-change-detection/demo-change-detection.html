<h3>Explain How Change Detection Work</h3>
<button class="btn" (click)="triggerRandomChange()">Trigger Change Detection (Random)</button>
<p>Parent Change Trigger: {{ randomValue() }}</p>

<hr>
<h4>Imperative State</h4>
<app-code-presenter-old [fileName]="currentFile()" [showRenderCount]="true"></app-code-presenter-old>

<hr>
<h4>Observable State</h4>
<app-code-presenter-observable [fileName]="currentFile()" [showRenderCount]="true"></app-code-presenter-observable>

<hr>
<h4>Signal State</h4>
<app-code-presenter-signal [fileName]="currentFile()" [showRenderCount]="true"></app-code-presenter-signal>

<hr>
@if (this.showExplainOnPush()) {
  <app-code-presenter-signal [fileName]="'explain-on-push.md'"></app-code-presenter-signal>
} @else {
  <button class="btn" (click)="triggerExplainOnPush()">Explain OnPush</button>
}

<hr>
@if (this.showSummary()) {
  <app-code-presenter-signal [fileName]="'explain-change-detection.md'"></app-code-presenter-signal>
} @else {
  <button class="btn" (click)="triggerSummary()">Summary</button>
}
